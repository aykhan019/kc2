# Lab environment: a local verdaccio registry, one victim agent, one attacker CLI.
# Usage (from the repo root):
#   docker compose -f docker/docker-compose.yml up -d registry setup victim
#   docker compose -f docker/docker-compose.yml run --rm attacker
name: npm-c2-lab

services:
  registry:
    image: verdaccio/verdaccio:6.9.2@sha256:5a13d03808135726efde69a5a16fce1e1f724a961d6d647177c22da83c0af5cd
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - registry-storage:/verdaccio/storage
      - ./verdaccio.yaml:/verdaccio/conf/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://localhost:4873/-/ping").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - lab

  setup:
    image: npm-c2-lab-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["/app/docker/setup-registry.sh"]
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      REGISTRY_URL: http://registry:4873
      SHARED_DIR: /shared
      PKG_NAME: my-package
    volumes:
      - shared:/shared
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      registry:
        condition: service_healthy
    networks:
      - lab

  victim:
    image: npm-c2-lab-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    environment:
      ROLE: victim
      NPM_C2_REGISTRY_URL: http://registry:4873
      NPM_C2_PACKAGE_NAME: my-package
      NPM_C2_POLL_INTERVAL: "5"
      NPM_C2_ALLOW_INSECURE_HTTP: "true"
      NPM_C2_FILESYSTEM_ROOT: /workspace
      NPM_C2_STATE_FILE: /state/victim-state.json
      TOKEN_FILE: /shared/token
    volumes:
      - shared:/shared:ro
      - victim-state:/state
      - victim-workspace:/workspace
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      - lab

  attacker:
    image: npm-c2-lab-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ROLE: attacker
      NPM_C2_REGISTRY_URL: http://registry:4873
      NPM_C2_PACKAGE_NAME: my-package
      NPM_C2_ALLOW_INSECURE_HTTP: "true"
      NPM_C2_STATE_FILE: /state/attacker-state.json
      NPM_C2_DOWNLOAD_DIR: /downloads
      TOKEN_FILE: /shared/token
    volumes:
      - shared:/shared:ro
      - attacker-state:/state
      - attacker-downloads:/downloads
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      setup:
        condition: service_completed_successfully
    # run interactively: docker compose -f docker/docker-compose.yml run --rm attacker
    stdin_open: true
    tty: true
    networks:
      - lab

volumes:
  registry-storage:
  shared:
  victim-state:
  victim-workspace:
  attacker-state:
  attacker-downloads:

networks:
  lab:
    internal: true
